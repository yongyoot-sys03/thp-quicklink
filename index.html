<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แชร์ Quick Link</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .btn-share { background-color: #06c755; color: white; border: none; padding: 18px 30px; font-size: 20px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 85%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: none; }
        .btn-share:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <button id="btnShare" class="btn-share">แชร์เมนู Quick Link ปข.3</button>

        const LIFF_ID = "2011764737-4atHAAHK"; 

        liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
                document.getElementById("btnShare").style.display = "block";
            } else {
                liff.login();
            }
        }).catch((err) => {
            alert("ระบบขัดข้อง: " + JSON.stringify(err));
        });

                            "contents": [

                            ]
                          },
                          "body": {
                            "type": "box",
                            "layout": "vertical",
                            "spacing": "md",
                            "paddingAll": "20px",
                            "contents": [
                              {
                                "type": "box",
                                "layout": "vertical",
                                "backgroundColor": "#2563eb",
                                "cornerRadius": "md",
                                "paddingAll": "12px",
                                "action": { "type": "uri", "label": "รายได้ ปข.3", "uri": "https://datastudio.google.com/reporting/e8f27de9-2a6f-4826-968b-5832dd277446" },
                                "contents": [ { "type": "text", "text": "📊 รายได้ ปข.3", "color": "#ffffff", "weight": "bold", "align": "center" } ]
                              },
                              {
                                "type": "box",
                                "layout": "vertical",
                                "backgroundColor": "#ef4444",
                                "cornerRadius": "md",
                                "paddingAll": "12px",
                                "action": { "type": "uri", "label": "ระบบ AICIP", "uri": "https://aicip-p3-app.onrender.com/" },
                                "contents": [ { "type": "text", "text": "🌐 AITHPREG03 (ปรับปรุง)", "color": "#ffffff", "weight": "bold", "align": "center" } ]
                              },
                              {
                                "type": "box",
                                "layout": "vertical",
                                "backgroundColor": "#f59e0b",
                                "cornerRadius": "md",
                                "paddingAll": "12px",
                                "action": { "type": "uri", "label": "SLA สลากฯ", "uri": "https://www.appsheet.com/start/68fcb5f9-b795-4057-bc52-273a7dd863d0" },
                                "contents": [ { "type": "text", "text": "⏱️ SLA สลากฯ", "color": "#ffffff", "weight": "bold", "align": "center" } ]
                              },
                              {
                                "type": "box",
                                "layout": "vertical",
                                "backgroundColor": "#10b981",
                                "cornerRadius": "md",
                                "paddingAll": "12px",
                                "action": { "type": "uri", "label": "เลือกตั้ง", "uri": "https://kritsada-thp.github.io/ElectionTHP/" },
                                "contents": [ { "type": "text", "text": "🗳️ เลือกตั้ง", "color": "#ffffff", "weight": "bold", "align": "center" } ]
                              },
                              {
                                "type": "box",
                                "layout": "vertical",
                                "backgroundColor": "#8b5cf6",
                                "cornerRadius": "md",
                                "paddingAll": "12px",
                                "action": { "type": "uri", "label": "ส่งต่างประเทศ", "uri": "https://script.google.com/macros/s/AKfycbxEyKRGW99ppQRgL_tmPoWQ1JvocnLnduioD177VIN9x_gvLuN-Q1Qe7yDXXT3EAws/exec" },

                              },
                              {
                                "type": "box",
                                "layout": "vertical",
                                "backgroundColor": "#06c755",
                                "cornerRadius": "md",
                                "paddingAll": "12px",
                                "action": { "type": "uri", "label": "Post Family", "uri": "https://page.line.me/670tpafc" },
                                "contents": [ { "type": "text", "text": "👪 Post Family", "color": "#ffffff", "weight": "bold", "align": "center" } ]
                              },
                              {
                                "type": "box",
                                "layout": "vertical",
                                "backgroundColor": "#db2777",
                                "cornerRadius": "md",
                                "paddingAll": "12px",
                                "action": { "type": "uri", "label": "Package", "uri": "https://docs.google.com/spreadsheets/d/1sLu2_oVzRG1HaQ-CqXWkLRz82lpxHT_K3WAStyNzXms/htmlview#gid=0" },

                    if (res) {
                        liff.closeWindow(); 
                    }
                }).catch((err) => {
                    alert("แชร์ไม่สำเร็จ: " + JSON.stringify(err));
                });
            }
        });
    </script>
</body>
</html>
