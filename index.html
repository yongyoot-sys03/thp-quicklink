            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;

        .btn-share {

            padding: 18px 30px; 
            font-size: 20px; 
            border-radius: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 85%; 
            max-width: 400px; 
            box-shadow: 0 10px 20px rgba(6, 199, 85, 0.3); 
            display: none; 
            transition: all 0.2s ease;

        .btn-share:active { 
            transform: scale(0.96);

        function toExternalUrl(url) {
            if (url.includes('?')) {

                    alert("แชร์ไม่สำเร็จ: " + JSON.stringify(err));

            }
        });
    </script>
