<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Share</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f9f9f9; }
        button { padding: 20px; font-size: 20px; background: #06c755; color: white; border: none; border-radius: 10px; width: 80%; }
    </style>
</head>
<body>

    <button id="btnShare">ทดสอบส่งข้อความธรรมดา</button>

    <script>
        // ใช้ LIFF ID ของคุณ
        liff.init({ liffId: "2011764737-4atHAAHK" }).then(() => {
            if (!liff.isLoggedIn()) {
                liff.login();
            }
        }).catch((err) => {
            alert("Init Error: " + JSON.stringify(err));
        });

        document.getElementById("btnShare").addEventListener("click", () => {
            // เช็กว่าปุ่มโดนคลิกจริงๆ
            alert("กำลังเปิดหน้าเลือกกลุ่ม/เพื่อน..."); 
            
            if (liff.isApiAvailable('shareTargetPicker')) {
                liff.shareTargetPicker([
                    {
                        "type": "text",
                        "text": "✅ ทดสอบระบบ: ฟีเจอร์ Share Target Picker ใช้งานได้ปกติครับ!"
                    }
                ]).then((res) => {
                    if (res) {
                        alert("ส่งสำเร็จ!");
                        liff.closeWindow();
                    } else {
                        alert("ยกเลิกการส่ง");
                    }
                }).catch((err) => {
                    alert("Share Error: " + JSON.stringify(err));
                });
            } else {
                alert("แอป LINE ไม่รองรับ ShareTargetPicker");
            }
        });
    </script>
</body>
</html>
