<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Link ปข.3 (ตล.)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px; /* ขนาดพอดีหน้าจอมือถือ */
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            padding: 40px 25px 30px 25px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            text-align: left;
        }
        .header-tag {
            color: #93c5fd;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .header-title {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 5px 0;
        }
        .header-subtitle {
            color: #cbd5e1;
            font-size: 14px;
            margin: 0;
        }
        .menu-container {
            padding: 25px;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 15px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s;
            box-sizing: border-box;
        }
        .menu-btn:active {
            transform: scale(0.96); /* เอฟเฟกต์ตอนกดปุ่มยุบลง */
        }
        .icon {
            font-size: 24px;
            margin-right: 15px;
        }
        
        /* ตั้งค่าสีแต่ละปุ่ม */
        .btn-1 { background-color: #2563eb; } /* สีน้ำเงิน */
        .btn-2 { background-color: #ef4444; } /* สีแดง */
        .btn-3 { background-color: #f59e0b; } /* สีส้ม */
        .btn-4 { background-color: #10b981; } /* สีเขียว */
        .btn-5 { background-color: #8b5cf6; } /* สีม่วง */
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ส่วนหัวแอป -->
        <div class="header">
            <div class="header-tag">📌 SHORTCUTS</div>
            <h1 class="header-title">Quick Link ปข.3</h1>
            <p class="header-subtitle">ส่วนการตลาดและบริการลูกค้า</p>
        </div>
        
        <!-- ส่วนปุ่มกดเมนู -->
        <div class="menu-container">
            <!-- 💡 คุณสามารถแก้ลิงก์ตรง href="..." ได้เลยครับ -->
            <a href="https://datastudio.google.com/reporting/e8f27de9-2a6f-4826-968b-5832dd277446" class="menu-btn btn-1">
                <span class="icon">📊</span> รายได้ ปข.3
            </a>
            
            <a href="https://aicip-p3-app.onrender.com/" class="menu-btn btn-2">
                <span class="icon">🌐</span> ระบบ AICIPReg03
            </a>
            
            <a href="https://www.appsheet.com/start/68fcb5f9-b795-4057-bc52-273a7dd863d0" class="menu-btn btn-3">
                <span class="icon">⏱️</span> SLA จ่ายสลากฯ
            </a>
            
            <a href="ลิงก์ภารกิจเลือกตั้งใส่ตรงนี้" class="menu-btn btn-4">
                <span class="icon">🗳️</span> ภารกิจเลือกตั้ง
            </a>
            
            <a href="https://international.thailandpost.com/" class="menu-btn btn-5">
                <span class="icon">✈️</span> ส่งของไปต่างประเทศ
            </a>
        </div>
    </div>
</body>
</html>
